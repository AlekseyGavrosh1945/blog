services:
    nginx:
        image: nginx:1.27-alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        build: ./docker/php
        volumes:
            - .:/var/www
        environment:
            DB_HOST: mysql
            DB_NAME: blog
            DB_USER: blog
            DB_PASSWORD: secret
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: blog
            MYSQL_USER: blog
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    mysql-data:
